name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Smoke (end-to-end)
        run: node --experimental-strip-types scripts/smoke.ts
        env:
          DB_PATH: ":memory:"
          DATA_DIR: ./.tmp-smoke
          LOG_LEVEL: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: waka-selfhost:ci

